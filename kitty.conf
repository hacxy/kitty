# cursor 光标
cursor_shape beam
cursor_trail 10
cursor_trail_decay 0.1 0.6
cursor_blink_interval 0
detect_urls no
mouse_hide_wait 1

# kitty_grab：按 ctrl+a 进入 vim 模式键盘选择/复制
map ctrl+a kitten kitty_grab/grab.py
# 打开 URL：按 ctrl+u 高亮屏幕上 URL，按字母标记用默认浏览器打开
map ctrl+u kitten hints --type url

# 滚动屏幕（vim 风格）：ctrl+b/f 整页上/下滚，ctrl+d 半页下滚
# 注意：这些键在 vim/neovim 内会被 kitty 拦截，vim 内翻页需另设键位
map ctrl+b scroll_page_up
map ctrl+f scroll_page_down
map ctrl+d remote_control scroll-window 0.5p

# ctrl+j/k 按住持续按行滚动（依赖系统按键重复）；j 向下 k 向上
# 注意：ctrl+j 原为换行（LF），映射后终端内不再发送换行
map ctrl+cmd+j scroll_line_down
map ctrl+cmd+k scroll_line_up

map cmd+shift+s  launch --location=hsplit
map cmd+shift+d  launch --location=vsplit
map cmd+h neighboring_window left
map cmd+j neighboring_window down
map cmd+k neighboring_window up
map cmd+l neighboring_window right
map cmd+x close_window
map  cmd+shift+h resize_window wider
map  cmd+shift+l resize_window narrower
map  cmd+shift+k resize_window shorter
map  cmd+shift+j resize_window taller

# 解除 kitty 默认的 ctrl+shift+←/→（切 tab）占用，避免与 grab 的按词移动冲突
map kitty_mod+Left   no_op
map kitty_mod+Right  no_op

# 解除默认 cmd+shift+[/]（切 tab）占用
map cmd+shift+[      no_op
map cmd+shift+]      no_op

# cmd+数字跳转到对应 tab（1~9）
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9
# shift+h 切上一个 tab，shift+l 切下一个 tab
# map cmd+shift+h previous_tab
# map cmd+shift+l next_tab

# BEGIN_KITTY_FONTS
font_family      family='JetBrainsMono Nerd Font'
bold_font        family='JetBrainsMono Nerd Font'
italic_font      family='JetBrainsMono Nerd Font'
bold_italic_font family='JetBrainsMono Nerd Font'
font_size 20

# 文字渲染合成策略：legacy 旧算法，深色背景下浅色文字更细更锐利（中文/暗色主题友好）
text_composition_strategy legacy
# 单元格行高：额外增加 1.2pt（不带后缀=pt），行距更宽松，避免 Nerd Font 图标/emoji 被裁切
modify_font cell_height 1.2
# 单元格宽度：缩为字体原始宽度的 95%（带% = 百分比），水平更紧凑，同宽度可显示更多字符
modify_font cell_width 95%


# tab_bar
tab_bar_edge            top
tab_bar_align           left
tab_bar_min_tabs        1
# 禁用鼠标拖拽 tab/窗口（防止 tab 被拖出成独立窗口）
drag_threshold           0
tab_bar_style                   custom
tab_powerline_style round
tab_separator                   ""
tab_bar_margin_width            0.0
# tab bar 内部 padding：上下 margin 用深色填充，与 tab bar 融为一体（视觉增高）
tab_bar_margin_height           0.0 5.0
# tab bar 内所有文字统一细体（常规字重，非粗体非斜体）
active_tab_font_style           normal
inactive_tab_font_style         normal
tab_activity_symbol             none
bell_on_tab                     no

# window 窗口
window_margin_width             0
# 窗口边框宽度：默认 0.5pt 太细；2pt 时因 minimal borders 只画共享缝且被两窗各占一半，仍难辨活跃侧。改为完整边框 + 3pt
window_border_width             1pt
# 画完整边框（默认 yes 只画窗间分隔缝）：活跃窗口被整圈亮色框包围，左右分屏一眼可辨
# 注意：设置非零 window_margin_width 会使此选项失效
# 非活跃窗口文字轻微淡化（负值=仅在多窗口时淡化），辅助区分活跃窗口
inactive_text_alpha             -0.6
draw_minimal_borders            yes
background_opacity              0.85
background_blur                 70
remember_window_size            yes
hide_window_decorations         titlebar-only

# 按键绑定


map cmd+v paste_from_clipboard

# 兼容nvim键位
map ctrl+` combine : send_key ctrl+_

# option 映射为 alt
macos_option_as_alt yes


# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME

# 主题之后覆盖：tab bar 透明跟随终端背景
tab_bar_background      none
inactive_tab_background #45475A
# 主题之后覆盖：活跃窗口边框用主题高亮紫（与活跃 tab 同色），非活跃边框压暗到接近背景色
active_border_color     #CBA6F7
# inactive_border_color   #45475A
