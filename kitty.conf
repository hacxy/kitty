# cursor 光标
cursor_shape beam
cursor_trail 10
cursor_trail_decay 0.1 0.6
cursor_blink_interval 0
detect_urls no
mouse_hide_wait 1

# kitty_grab：按 ctrl+a 进入 vim 模式键盘选择/复制
map ctrl+[ kitten kitty_grab/grab.py
# 打开 URL：按 ctrl+u 高亮屏幕上 URL，按字母标记用默认浏览器打开
map ctrl+u kitten hints --type url
# vim 风格分屏：ctrl+s 进入分屏模式，s=横屏切割(hsplit 上下) v=竖屏切割(vsplit 左右)
enabled_layouts splits
map --new-mode split ctrl+a
map --mode split s launch --location=hsplit
map --mode split v launch --location=vsplit
map --mode split h neighboring_window left
map --mode split j neighboring_window down
map --mode split k neighboring_window up
map --mode split l neighboring_window right
map --mode split x close_window
map --mode split escape pop_keyboard_mode
# 解除 kitty 默认的 ctrl+shift+←/→（切 tab）占用，避免与 grab 的按词移动冲突
map kitty_mod+Left   no_op
map kitty_mod+Right  no_op
map Ctrl+Page_Up     previous_tab
map Ctrl+Page_Down   next_tab


# BEGIN_KITTY_FONTS
font_family      family='JetBrainsMono Nerd Font'
bold_font        family='JetBrainsMono Nerd Font'
italic_font      family='JetBrainsMono Nerd Font'
bold_italic_font family='JetBrainsMono Nerd Font'
font_size 20

# 文字渲染合成策略：legacy 旧算法，深色背景下浅色文字更细更锐利（中文/暗色主题友好）
text_composition_strategy legacy
# 单元格行高：额外增加 1.2pt（不带后缀=pt），行距更宽松，避免 Nerd Font 图标/emoji 被裁切
modify_font cell_height 1.2
# 单元格宽度：缩为字体原始宽度的 95%（带% = 百分比），水平更紧凑，同宽度可显示更多字符
modify_font cell_width 95%


# tab_bar
tab_bar_edge            top
tab_bar_align           left
tab_bar_min_tabs        1
# 禁用鼠标拖拽 tab/窗口（防止 tab 被拖出成独立窗口）
drag_threshold           0
tab_bar_style                   custom
tab_powerline_style round
tab_separator                   ""
tab_bar_margin_width            0.0
# tab bar 内部 padding：上下 margin 用深色填充，与 tab bar 融为一体（视觉增高）
tab_bar_margin_height           0.0 5.0
# tab bar 内所有文字统一细体（常规字重，非粗体非斜体）
active_tab_font_style           normal
inactive_tab_font_style         normal
tab_activity_symbol             none
bell_on_tab                     no

# window 窗口
window_margin_width             0
background_opacity              0.85
background_blur                 64
remember_window_size            yes
hide_window_decorations         titlebar-only

# 按键绑定


map cmd+v paste_from_clipboard

# 兼容nvim键位
map ctrl+` combine : send_key ctrl+_

# option 映射为 alt
macos_option_as_alt yes


# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME

# 主题之后覆盖：tab bar 透明跟随终端背景
tab_bar_background      none
inactive_tab_background #45475A
